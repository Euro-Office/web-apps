name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out web-apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Install dependencies
        working-directory: build
        env:
          # The tests use the runner's Chrome
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      # On pull requests with coverage, see build/README.md#tests
      - name: Run unit tests
        working-directory: build
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run ${{ github.event_name == 'pull_request' && 'coverage' || 'test' }}

      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request'
        uses: Euro-Office/.github/actions/diff-coverage@c6be61e1c3cc63761a8a70c71fad268bf9ee434e # main
        with:
          reports: coverage/browser/lcov.info coverage/build/lcov.info
          fail-under: 80
