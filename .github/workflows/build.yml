name: "Build"

on:
    workflow_dispatch:
    push:

jobs:
    build-apps:
        name: "Build web-apps"
        runs-on: self-hosted
        env:
            NODE_VERSION: 20
            PRODUCT_VERSION: 9.2.1
        steps:

          - name: Checkout web-apps
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
                repository: euro-office/web-apps
                ref: ${{github.ref}}
                path: 'web-apps'

          - name: Checkout SDKJS
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
                repository: euro-office/sdkjs
                ref: ${{env.REF}}
                path: 'sdkjs'
                fetch-depth: '1'

          - name: Use Node.js ${{ env.NODE_VERSION }}
            uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
            with:
                node-version: ${{ env.NODE_VERSION }}

          - name: Install dependencies
            run: |
              cd web-apps/build
              npm install

          - name: Merge translations
            run: |
              cd web-apps/translation
              python3 merge_and_check.py

          - name: Build web-apps
            working-directory: web-apps/build
            env:
                BUILD_ROOT: ${{ github.workspace }}/web-apps/deploy
                THEME: euro-office
            run: node scripts/build-pipeline.js
