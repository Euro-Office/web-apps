<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Unit Tests</title>
    <link rel="stylesheet" href="../../../build/node_modules/mocha/mocha.css" type="text/css" media="screen" title="no title" charset="utf-8">
</head>
<body>
<div id="mocha"></div>
<script src="../../../build/node_modules/mocha/mocha.js" type="text/javascript" charset="utf-8"></script>
<script src="../../../vendor/requirejs/require.js" type="text/javascript" charset="utf-8"></script>

<script type="module">
    // chai 5.x ships ESM only, so it cannot be pulled in by requirejs.
    // Import it here and register it under the id the test files already use,
    // so define(['chai']) and require('chai') keep working unchanged.
    import * as chai from '../../../build/node_modules/chai/chai.js';
    window.chai = chai;
    define('chai', [], function () { return chai; });

    // Partial config file
    require.config({
        // Base URL relative to the test runner
        // Paths are relative to this
        baseUrl: '../../../apps/',
        paths: {
            // Testing libs
            'common'            : 'common',
            'jquery'            : '../vendor/jquery/jquery.min',
            'underscore'        : '../vendor/underscore/underscore',
            'backbone'          : '../vendor/backbone/backbone',
            'bootstrap'         : '../vendor/bootstrap/dist/js/bootstrap',
            'perfectscrollbar'  : '../vendor/perfect-scrollbar/src/perfect-scrollbar',
            'jmousewheel'       : '../vendor/perfect-scrollbar/src/jquery.mousewheel',
            'text'              : '../vendor/requirejs-text/text'
        },
        // The editor views pull in their settings panels and controls; the
        // tests only drive the view's own logic, so stand those in with a stub.
        map: {
            'documenteditor/main/app/view/RightMenu': {
                'common/main/lib/component/MetricSpinner'      : '../test/unit-tests/stub',
                'common/main/lib/component/CheckBox'           : '../test/unit-tests/stub',
                'common/main/lib/component/Scroller'           : '../test/unit-tests/stub',
                'common/main/lib/component/ListView'           : '../test/unit-tests/stub',
                'documenteditor/main/app/view/ParagraphSettings': '../test/unit-tests/stub',
                'documenteditor/main/app/view/ImageSettings'    : '../test/unit-tests/stub',
                'documenteditor/main/app/view/ChartSettings'    : '../test/unit-tests/stub',
                'documenteditor/main/app/view/TableSettings'    : '../test/unit-tests/stub',
                'documenteditor/main/app/view/ShapeSettings'    : '../test/unit-tests/stub',
                'documenteditor/main/app/view/MailMergeSettings': '../test/unit-tests/stub',
                'documenteditor/main/app/view/TextArtSettings'  : '../test/unit-tests/stub',
                'documenteditor/main/app/view/SignatureSettings': '../test/unit-tests/stub',
                'documenteditor/main/app/view/FormSettings'     : '../test/unit-tests/stub'
            }
        },
        shim: {
            backbone: {
                deps: [
                    'underscore',
                    'jquery'
                ],
                exports: 'Backbone'
            },
            underscore: {
                exports: '_'
            },
            bootstrap: {
                deps: [
                    'jquery'
                ]
            },
            common: {
                deps: [
                    'backbone'
                ]
            },
            jmousewheel: {
                deps: [
                    'jquery'
                ]
            },
            perfectscrollbar: {
                deps: [
                    'jmousewheel'
                ]
            }
        }
        // urlArgs: /debug\=1/.test(window.location.search) ? '' : 'bust=' +  (new Date()).getTime(), // debug
    });

    // You can do this in the grunt config for each mocha task, see the `options` config
    mocha.setup({
        ui: 'bdd'
    });

    // Protect from barfs
    console = window.console || function() {};

    // Don't track
    window.notrack = true;

    // Mocha run helper, used for browser
    var runMocha = function() {
        mocha.run();
    };

    // The app modules under test read $, _ and Backbone as globals rather than
    // declaring them as dependencies, so requirejs is free to evaluate them
    // before the vendor libs land. Load the globals first, then the tests.
    require(['jquery', 'underscore', 'backbone'], function ($, _, Backbone) {
        // underscore's UMD build registers itself as an AMD module and leaves
        // no global behind, so publish the three the app modules expect.
        window.$ = window.jQuery = $;
        window._ = _;
        window.Backbone = Backbone;

        // The test setup module publishes assert/expect and stubs the ambient
        // Common.* state the components read at render time. A flat require
        // array would let requirejs evaluate whichever module lands first, so
        // wait for the setup to finish before the tests are pulled in.
        require(['../test/unit-tests/common'], function () {
            require([
                './main/lib/util/utils.js',
                './main/lib/component/Button.js',
                './main/lib/component/MenuItem.js',
                '../documenteditor/main/app/view/RightMenu.js'
            ], runMocha);
        });
    });
</script>
</body>
</html>
